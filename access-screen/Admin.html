function pretty(v){if(Array.isArray(v))return v.map(x=>typeof x==='object'?Object.entries(x).filter(([k])=>!['signature','requestKey','amountEntered','items'].includes(k)).map(([k,v])=>(({label:'항목',amount:'금액',detail:'내역',kind:'항목',otherKind:'기타'})[k]||k)+': '+pretty(v)).join(' / '):String(x)).join('\n');return v==null?'':typeof v==='object'?JSON.stringify(v,null,2):String(v);}

async function auditView(){rows=await rpc('audit.list');const v=viewReset(),p=panel('최근 변경 이력');p.p.append(E('p','최근 300건을 표시합니다. 변경 이력에는 연결 비밀키와 서명 이미지를 기록하지 않습니다.','small muted'));if(!rows.length)empty(p.p,'기록된 변경 이력이 없습니다.');else p.p.append(table(['일시','처리 계정','작업','대상','상세'],rows,r=>[r.updatedAt,r.actor,r.action,r.target,r.detail]));v.append(p.p);}
function parseCsv(s){const out=[];let row=[],v='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v='';}else v+=c;}if(quoted)throw Error('CSV 따옴표 형식을 확인하세요.');row.push(v);if(row.some(x=>x.trim()))out.push(row);return out;}
function mapPeople(matrix,kind,term){if(matrix.length<2)throw Error('제목행과 명단이 필요합니다.');const headers=matrix[0].map(x=>String(x||'').replace(/^\ufeff/,'').trim()),find=(r,names)=>{for(const n of names){const i=headers.indexOf(n);if(i>=0&&r[i]!=null&&String(r[i]).trim())return String(r[i]).trim();}return '';};return matrix.slice(1).filter(r=>r.some(x=>String(x||'').trim())).map(r=>({kind,name:find(r,['성명','이름']),personNo:find(r,['학번','사번','학번·사번']),department:find(r,['소속','학과']),emails:[find(r,['이메일','메일','이메일1']),find(r,['추가이메일','이메일2'])].filter(Boolean).join(','),term:find(r,['학기'])||term,active:!['false','0','비활성','제외','아니오'].includes(find(r,['활성','참여여부']).toLowerCase()),note:find(r,['메모'])}));}
async function readImport(file){if(file.size>5000000)throw Error('파일은 5MB 이하로 나누어 업로드하세요.');if(/\.csv$/i.test(file.name))return parseCsv(await file.text());if(!/\.xlsx$/i.test(file.name))throw Error('XLSX 또는 UTF-8 CSV 파일을 선택하세요.');const zip=await unzipXlsx(await file.arrayBuffer()),xml=name=>{if(!zip.has(name))throw Error('엑셀 구성 파일이 없습니다: '+name);const raw=zip.get(name);if(/<!DOCTYPE|<!ENTITY/i.test(raw))throw Error('지원하지 않는 XML 선언입니다.');const d=new DOMParser().parseFromString(raw,'application/xml');if(d.querySelector('parsererror'))throw Error('엑셀 XML 형식을 확인하세요.');return d;},tags=(d,t)=>Array.from(d.getElementsByTagNameNS('*',t));const strings=zip.has('xl/sharedStrings.xml')?tags(xml('xl/sharedStrings.xml'),'si').map(x=>tags(x,'t').map(x=>x.textContent).join('')):[];const book=xml('xl/workbook.xml'),first=tags(book,'sheet')[0];if(!first)throw Error('워크시트가 없습니다.');const rel=first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),rels=tags(xml('xl/_rels/workbook.xml.rels'),'Relationship'),target=rels.find(x=>x.getAttribute('Id')===rel);if(!target||target.getAttribute('TargetMode')==='External')throw Error('첫 워크시트를 확인하세요.');const t=target.getAttribute('Target'),path=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'');if(path.includes('..'))throw Error('지원하지 않는 엑셀 경로입니다.');const rows=tags(xml(path),'row');if(rows.length>251)throw Error('제목행 제외 250명 이하로 나누어 업로드하세요.');return rows.map(row=>{const values=[];for(const c of tags(row,'c')){const ref=c.getAttribute('r')||'A1',letters=ref.match(/^[A-Z]+/)[0];let n=0;for(const l of letters)n=n*26+l.charCodeAt(0)-64;if(n>80)continue;const type=c.getAttribute('t'),v=tags(c,'v')[0];values[n-1]=type==='s'?strings[Number(v&&v.textContent)]||'':type==='inlineStr'?tags(c,'t').map(x=>x.textContent).join(''):v?v.textContent:'';}return values;});}
async function unzipXlsx(buffer){const a=new Uint8Array(buffer),v=new DataView(buffer),decoder=new TextDecoder();let end=-1;for(let i=a.length-22;i>=Math.max(0,a.length-65558);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break;}if(end<0)throw Error('XLSX 압축 구조를 확인하세요.');let pos=v.getUint32(end+16,true),count=v.getUint16(end+10,true),total=0;const files=new Map();if(count>1000)throw Error('엑셀 구성 파일이 너무 많습니다.');for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('XLSX 목록 오류');const method=v.getUint16(pos+10,true),compressed=v.getUint32(pos+20,true),size=v.getUint32(pos+24,true),nameLen=v.getUint16(pos+28,true),extra=v.getUint16(pos+30,true),comment=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true),name=decoder.decode(a.slice(pos+46,pos+46+nameLen));pos+=46+nameLen+extra+comment;if(!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(name))continue;total+=size;if(size>10000000||total>20000000)throw Error('엑셀 자료가 너무 큽니다.');if(v.getUint32(offset,true)!==0x04034b50)throw Error('엑셀 압축 오류');const start=offset+30+v.getUint16(offset+26,true)+v.getUint16(offset+28,true),bytes=a.slice(start,start+compressed);let content;if(method===0)content=bytes;else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('최신 Chrome을 사용하거나 CSV로 저장하여 업로드하세요.');const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader(),parts=[];let length=0;while(true){const {value,done}=await reader.read();if(done)break;length+=value.byteLength;if(length>size||length>10000000){await reader.cancel();throw Error('엑셀 압축 크기 오류');}parts.push(value);}content=new Uint8Array(length);let at=0;for(const part of parts){content.set(part,at);at+=part.length;}}else throw Error('지원하지 않는 압축 형식입니다.');if(content.length!==size)throw Error('엑셀 파일이 손상되었습니다.');files.set(name,decoder.decode(content));}return files;}
